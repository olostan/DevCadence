name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Never cancel main: each pushed commit keeps its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    name: static
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Formatting, module hygiene, vet, and diff checks
        env:
          DIFF_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          FMT_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: make fmt-check diff-check mod-check vet

  test-contracts:
    name: test-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Unit, schema, and documentation contracts
        run: make test schemas docs-check

  race:
    name: race
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Race detector
        run: make race

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Compare PR coverage with exact base
        if: github.event_name == 'pull_request'
        env:
          COVERAGE_EXPORT_DIR: ${{ github.workspace }}
        run: sh scripts/health/coverage-guard.sh "${{ github.event.pull_request.base.sha }}" "."
      - name: Measure main coverage
        if: github.event_name != 'pull_request'
        run: |
          make coverage
          total=$(awk '/^total:/ { print $3 }' coverage.txt)
          printf "candidate=%s\n" "$total" > coverage-summary.txt
      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage-summary.txt ]; then
            {
              echo "### Coverage"
              echo
              echo '~~~text'
              cat coverage-summary.txt
              echo '~~~'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: |
            coverage.out
            coverage.txt
            coverage-summary.txt
          if-no-files-found: ignore
