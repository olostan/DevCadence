# Illustrative DevCadience project configuration.
# This file is a design example until the configuration loader is implemented.
#
# The `cognition` block below is shaped to the M3A types it will load into
# (cognition.Declaration and cognition.Policy); the rest still describes intent
# for later milestones.

schema_version: "0.1"

project:
  id: example
  repository: /absolute/path/to/repository
  accepted_branch: main

deployment:
  # Suggested by guided setup after environment discovery; operator may override.
  # local-heavy | hybrid-thin | cloud-cognition | offline | custom
  profile: hybrid-thin

principal:
  # Initial first-class hosts: antigravity | cursor | vscode.
  # Host setup may be deferred.
  host: antigravity
  information_firewall: true
  allow_raw_source_escalation: true

cognition:
  # Endpoints are *discovered*, not declared: `devcadience cognition list` reports
  # what exists, its health, its cost class and whether its acceleration was
  # verified. The block below declares only what discovery cannot observe.
  #
  # Endpoint ids are "<adapter>:<instance>" as discovery reports them, for example
  # "ollama:qwen3:4b", "mlx:mlx-community/Qwen3-4B-4bit" or "cli:codex-cli".
  declarations:
    - endpoint: "ollama:<model-as-discovered>"
      # Capability grades are recorded with provenance "configured", never
      # "measured": an operator may legitimately assert what DevCadience cannot
      # measure, and the assertion stays traceable to whoever made it. A measured
      # or evaluated grade is never overwritten by a declaration.
      capabilities:
        repository_reasoning: medium
      context_tokens: 16384
      max_concurrent_sessions: 1

    - endpoint: "cli:<coding-cli-as-discovered>"
      capabilities:
        implementation: strong
        review: strong
      # Opaque reference only. A raw key here is refused at load time rather
      # than redacted afterwards.
      credential_ref: "<credential-reference>"
      cost_class: subscription_included
      source_exposure: tool_mediated_worktree

  routing:
    # The maximum classes this project permits. Both are hard constraints, and an
    # unset policy fails closed to local_only / local_compute.
    max_source_exposure: focused_snippets
    max_cost_class: remote_economy

    # Preference orders *eligible* endpoints. It cannot make an ineligible
    # endpoint eligible, so it can never route around the privacy policy.
    prefer:
      scout: ["ollama:<model-as-discovered>", "cli:<coding-cli-as-discovered>"]
      implementer: ["cli:<coding-cli-as-discovered>"]
      correctness_reviewer: ["cli:<coding-cli-as-discovered>"]
      architecture_reviewer: ["cli:<coding-cli-as-discovered>"]

setup:
  allow_privileged_auto_apply: false
  require_plan_before_mutation: true
  verify_acceleration_with_inference_probe: true

validation:
  profiles:
    fast:
      - argv: ["go", "test", "./internal/..."]
        timeout: 10m
      - argv: ["go", "vet", "./..."]
        timeout: 10m

    full:
      - argv: ["go", "test", "./..."]
        timeout: 30m

policy:
  discovery:
    ask_human_batch_size: 4
    require_specification_readiness_for_architecture: true
    require_human_reflection_for_greenfield: true
    substantial_project_reviews:
      - completeness
      - ambiguity
      - contradiction
      - security_privacy
      - failure_modes
      - architecture_contamination
    safe_deferral_requires_boundary: true

  retry:
    max_implementation_attempts: 3

  review_convergence:
    finding_budget_per_reviewer: 5
    broad_reporting_threshold: medium
    focused_revalidation_reopen_threshold: high
    closure_reopen_threshold: critical
    max_repair_rounds: 2
    parallel_broad_review: true
    require_principal_adjudication: true
    one_repair_work_package_per_round: true
    freeze_after_closure_gate: true
    reopen_requires_new_evidence: true

  change_paths:
    local:
      principal_design_required: false
      correctness_review_required: true

    systemic:
      principal_design_required: true
      alternatives_required: true
      correctness_review_required: true
      architecture_review_required: true

    architectural:
      principal_design_required: true
      alternatives_required: true
      adversarial_critique_required: true
      adr_required: true
      architecture_review_required: true
      principal_acceptance_required: true

  refactoring:
    after_systemic_tasks: 20
    after_milestone: true

consultants:
  # Optional. Guided setup discovers which supported endpoints are actually available.
  required: false
  allow_discovered: true
  preferred: []
  send_raw_source: false

security:
  worker_network: deny_by_default
  destructive_operations_require_human: true
